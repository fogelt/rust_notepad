name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Windows'

      # A restored target cache can claim sherpa-onnx-sys is built without the
      # prebuilt library directory it downloaded, so the linker cannot find the
      # .lib files. Windows builds start from a clean target; the registry cache
      # still avoids re-downloading crates.
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
        with:
          cache-targets: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  package-windows:
    name: Package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Windows builds are not target-cached: a restored sherpa-onnx-sys
      # fingerprint without its prebuilt lib directory breaks the link.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build installer
        run: cargo packager --release --formats nsis --out-dir dist

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was produced.' }

          $target = Join-Path $env:RUNNER_TEMP 'rusty-notepad-smoke'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait

          $required = @(
            'rust_notepad.exe',
            'rmd.exe',
            'onnxruntime.dll',
            'onnxruntime_providers_shared.dll',
            'sherpa-onnx-c-api.dll',
            'sherpa-onnx-cxx-api.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $target $file))) {
              throw "Installer is missing $file"
            }
          }

          Start-Process -FilePath (Join-Path $target 'uninstall.exe') -ArgumentList '/S' -Wait
          if (Test-Path (Join-Path $target 'rust_notepad.exe')) {
            throw 'Uninstall left the application behind.'
          }
